# Fly.io config for the agensis realtime backend (server/index.cjs).
#
# Netlify can't host WebSockets, so the WS realtime + agent-daemon endpoint
# (/backend/ws) and the rest of the Express API run here. The static frontend
# stays on Netlify; daemons are pointed here via AGENSIS_DAEMON_BASE_URL.
#
# First deploy:
#   flyctl auth login
#   fly launch --no-deploy --copy-config --name agensis-backend   # or: fly apps create agensis-backend
#   fly secrets set DATABASE_URL='...' ANTHROPIC_API_KEY='...' AGENSIS_AUTH_SECRET='...'
#   fly deploy
# Secrets live in `fly secrets`, NEVER in this file.

app = "agensis-backend"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  HOST = "0.0.0.0"
  API_PORT = "8080"
  NODE_ENV = "production"
  # Uploaded file bytes default to <cwd>/.agensis_uploads on the machine's
  # EPHEMERAL rootfs, so they are lost on every deploy/restart and are not shared
  # across machines (review H6). To persist them, provision a volume and point
  # the upload root at its mount (uncomment this + the [[mounts]] block below):
  #   fly volumes create agensis_uploads --region fra --size 3
  # AGENSIS_UPLOAD_ROOT = "/data/uploads"

# Persistent storage for uploaded files (H6). Uncomment once the volume above
# exists; adding a mount for a volume that does not exist yet breaks `fly deploy`.
# Note: a single volume attaches to ONE machine, so uploads are durable but not
# shared — for multi-machine scale-out, move bytes to object storage (S3/R2).
# [[mounts]]
#   source = "agensis_uploads"
#   destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm so open WebSockets (browser realtime + agent daemons)
  # are not torn down by idle auto-stop.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/backend/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
