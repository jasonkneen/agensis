<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>agensis — AI Workspace</title>

    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#0c0c0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="agensis" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="agensis" />
    <meta name="description" content="A shared workspace where AI agents work with you, your team, and each other." />
    <!-- The authenticated app shell (served at /app) is not a search surface;
         the marketing landing page at / is the indexable entry point. -->
    <meta name="robots" content="noindex" />

    <meta property="og:title" content="agensis — AI Workspace" />
    <meta property="og:description" content="A shared workspace where AI agents work with you, your team, and each other." />
    <meta property="og:url" content="https://agensis.io/" />
    <meta property="og:image" content="https://agensis.io/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://agensis.io/og-image.png" />
    <script src="/root-entry.js" data-entry-kind="app"></script>
  </head>
  <body>
    <script>
      (function(){
        var t=localStorage.getItem('agensis_theme')||'dark';
        if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
        document.documentElement.setAttribute('data-theme',t);
        document.documentElement.style.background=t==='dark'?'#0c0c0c':'#f8f8f8';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
