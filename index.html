<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>agensis — AI Workspace</title>

    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#2b2d48" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="agensis" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="agensis" />
    <meta name="description" content="A shared workspace where AI agents work with you, your team, and each other." />
    <!-- The authenticated app shell (served at /app) is not a search surface;
         the marketing landing page at / is the indexable entry point. -->
    <meta name="robots" content="noindex" />

    <meta property="og:title" content="agensis — AI Workspace" />
    <meta property="og:description" content="A shared workspace where AI agents work with you, your team, and each other." />
    <meta property="og:url" content="https://agensis.io/" />
    <meta property="og:image" content="https://agensis.io/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://agensis.io/og-image.png" />
    <script src="/root-entry.js" data-entry-kind="app"></script>
  </head>
  <body>
    <script>
      (function(){
        // One style (Expo); the stored choice is only the scheme plus colours.
        // Mirrors normalizeThemeMode (src/hooks/useTheme.ts) so first paint is
        // right before React loads.
        var mode=String(localStorage.getItem('agensis_theme')||'light');
        var scheme=mode==='system'||/-system$/.test(mode)?'system':(mode==='dark'||/-dark$/.test(mode)?'dark':'light');
        var t=scheme==='system'?(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):scheme;
        var r=document.documentElement;
        r.setAttribute('data-theme',t);
        r.setAttribute('data-ui-theme','expo');
        ['base','accent','paper'].forEach(function(k){
          var v=localStorage.getItem('agensis_expo_'+k);
          if(v)r.setAttribute('data-expo-'+k,v);
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
