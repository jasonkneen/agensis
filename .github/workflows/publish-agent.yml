name: Publish agent to npm

# Publishes the daemon package @agensis/agensis-agent to npm when an agent
# version tag is pushed, so remote hosts can pick up the fix with
#   npm i -g @agensis/agensis-agent@latest
# without anyone publishing from a laptop.
#
#     git tag agent-v0.1.23
#     git push origin agent-v0.1.23
#
# Requires a repo secret NPM_TOKEN (an npm automation token with publish rights
# to the @agensis scope). Can also be run manually from the Actions tab, which
# does a dry-run pack only (no publish) so you can smoke-test the pipeline.
on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish @agensis/agensis-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The bundle is built by the package's own prepack script (node build.mjs),
      # which imports esbuild — a devDependency. A clean runner has no
      # node_modules, so install dev deps first or prepack fails. There is no
      # lockfile for this subpackage, hence `npm install` (not `npm ci`).
      - name: Install build dependencies
        working-directory: agent/agensis-agent
        run: npm install --include=dev --no-audit --no-fund
      - name: Verify the tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/agent-v')
        working-directory: agent/agensis-agent
        run: |
          TAG="${GITHUB_REF_NAME#agent-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME ($TAG) does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing @agensis/agensis-agent@$PKG"

      - name: Pack (dry-run smoke test)
        working-directory: agent/agensis-agent
        run: npm pack --dry-run

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/agent-v')
        working-directory: agent/agensis-agent
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
