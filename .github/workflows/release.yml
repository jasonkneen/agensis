name: Release Desktop App

# Build and publish desktop installers whenever a version tag is pushed.
# Push a tag like `v0.1.2` to trigger a release:
#
#     git tag v0.1.2
#     git push origin v0.1.2
#
# The workflow can also be kicked off manually from the Actions tab.
# Manual runs build installers as artifacts only (no GitHub Release) unless
# you also push a matching version tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Thin shell: bake the hosted backend into the desktop renderer.
  # Never set this on the Netlify web build — web stays same-origin.
  VITE_BACKEND_BASE_URL: https://agensis-backend.fly.dev
  AGENSIS_DESKTOP_BUILD: '1'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Icon + desktop vite bundle (relative base + backend URL) + electron-builder.
      # desktop-build.mjs is the single path that matches a local `npm run desktop:dist`.
      - name: Build desktop installers
        run: node scripts/desktop-build.mjs --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing when no certificates are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agensis-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore
