name: CI

# Runs the full quality gate on every push to main and every pull request so
# typecheck / lint / test regressions are caught before merge. (Release builds
# live in release.yml and run only on version tags.)
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Backend tests (node:test)
        run: npm test

      - name: Unit tests (vitest)
        run: npm run test:unit

  # Lint lives in its own job on purpose. It used to run between typecheck and
  # the tests in the job above, and because `npm run lint` currently exits 1 on
  # pre-existing no-unused-vars errors, Actions aborted before either test suite
  # ever ran. Split out, a lint failure is still a red check but it can no
  # longer hide a test regression.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
